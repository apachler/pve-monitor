# Full config exercising every block type the parser handles.
node node1 {
    address 127.0.0.1
    port 8006
    monitor_account monitor
    monitor_password secret
    realm pam
    mem 80 90
    cpu 80 95
    disk 80 90
    mem_alloc 90 100
    cpu_alloc 90 100
}
node node2 {
    address 127.0.0.2
    port 8006
    monitor_account monitor
    monitor_password secret
    realm pam
    mem 80 90
    cpu 80 95
    disk 80 90
}
storage local-lvm {
    disk 80 90
    node node1
}
container ct100 {
    mem 80 90
    cpu 80 95
    disk 80 90
}
qemu vm200 {
    mem 80 90
    cpu 80 95
    disk 80 90
}
pool everything {
    mem 90 95
    cpu 90 95
    disk 90 95
}
