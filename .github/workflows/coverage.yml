name: coverage

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.38"

      - name: Install dependencies (runtime + Devel::Cover)
        # --with-develop pulls in `on 'develop' => sub { ... }` from
        # cpanfile, which is where Devel::Cover lives.
        run: cpanm --installdeps --with-develop --notest --quiet .

      - name: Run prove under Devel::Cover
        run: |
          rm -rf cover_db
          PERL5OPT="-MDevel::Cover=-silent,1,-db,cover_db,-coverage,statement,branch,subroutine" \
            prove -r t/

      - name: Generate report (HTML + JSON summary)
        id: report
        run: |
          # Text summary into the step log (visible in the run).
          cover -summary | tee cover_summary.txt
          # HTML and JSON for the artifact / badge wiring.
          cover -report html_basic -outputdir cover_db
          cover -report json -outputdir cover_db
          # Pull the blended-total percentage for the run summary.
          pct=$(perl -ne 'print $1 if /^Total\s+\S+\s+\S+\s+\S+\s+(\S+)/' cover_summary.txt)
          echo "coverage_total=$pct" >>"$GITHUB_OUTPUT"
          echo "## Coverage: ${pct}%" >>"$GITHUB_STEP_SUMMARY"
          {
            echo '```'
            cat cover_summary.txt
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Enforce coverage floor
        # Buffer below the measured baseline (81.4% as of the suite's
        # initial commit). Bumping this up is appropriate after a real
        # coverage improvement lands; lowering it should require a
        # deliberate PR review.
        env:
          COVERAGE_FLOOR: "78.0"
        run: |
          pct="${{ steps.report.outputs.coverage_total }}"
          if [ -z "$pct" ]; then
            echo "Could not parse coverage percentage; failing closed." >&2
            exit 1
          fi
          # awk for portable float compare; bash doesn't do floats.
          if awk -v p="$pct" -v f="$COVERAGE_FLOOR" 'BEGIN{exit !(p+0 < f+0)}'; then
            echo "Coverage ${pct}% is below floor ${COVERAGE_FLOOR}%" >&2
            exit 1
          fi
          echo "Coverage ${pct}% >= floor ${COVERAGE_FLOOR}%"

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: cover_db/
          retention-days: 14
