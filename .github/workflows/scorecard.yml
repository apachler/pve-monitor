name: scorecard

# OpenSSF Scorecard — runs a battery of supply-chain / repo-hygiene
# probes (branch protection, pinned actions, signed releases, token
# permissions, etc.) and uploads the result so it shows up in the
# GitHub Security tab and the public Scorecard registry.
#
# The badge on README points at deps.dev's hosted result for the repo.

on:
  branch_protection_rule:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [master]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload SARIF results to the code-scanning API.
      security-events: write
      # Needed for keyless signing of the result attestation.
      id-token: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

      - name: Upload artifact (debugging)
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 7
